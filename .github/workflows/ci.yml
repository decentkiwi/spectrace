name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build_report.py reads the spectrace-baseline tag / git history

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baseline app tests (must be green before SpecTrace runs)
        working-directory: bank-app
        run: ./mvnw -q test

      - name: Report builder unit tests
        run: python3 -m unittest discover -s tools -v

      - name: Demo still produces the expected matrix
        run: |
          bash demo-kit/replay-answer-key.sh
          python3 - <<'EOF'
          import json, sys
          m = json.load(open("spectrace-out/metrics.json"))
          c = m["status_counts"]
          got = (c["COVERED"], c["NEW_TEST_PASS"], c["FAILING"], c["NOT_IMPLEMENTED"])
          problems = []
          if got != (12, 6, 2, 2):
              problems.append(f"expected covered/new/bug/missing = 12/6/2/2, got {got}")
          if m["agent_disagreements"]:
              problems.append(f"agent disagreements: {m['agent_disagreements']}")
          if problems:
              sys.exit("; ".join(problems))
          print("demo matrix OK:", got)
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spectrace-matrix
          path: spectrace-out/
