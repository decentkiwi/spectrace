server.port=8080
spring.application.name=spectrace-bank

# JWT — override JWT_SECRET env-var in production (min 32 chars)
bank.jwt.secret=${JWT_SECRET:spectrace-dev-secret-change-in-prod-min32chars}
bank.jwt.expiry-seconds=3600

# Rate limiting: max login attempts per window
bank.security.login-max-attempts=5
bank.security.login-window-seconds=900

# Actuator: expose health only publicly
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Logging
logging.level.com.spectrace.bank=INFO
logging.level.org.springframework.security=WARN
